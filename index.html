<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pengesahan QR KAFA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 32px 24px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .mode {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .code {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 6px;
      margin: 24px 0;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .info {
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>SISTEM REKOD KELUAR MASUK GURU KAFA</h1>

    <p>KAFA INTEGRASI SUNGAI LANG BARU</p>

    <div id="content">
      Sedang mengesahkan QR...
    </div>

  </div>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzDikjwJwKU3ORh4Y-S4zQM8o_Ppq3MIHsRTm4KQej4HMSquMCzxdXXVygODiuxu7q8/exec";

    const params =
      new URLSearchParams(window.location.search);

    const mode =
      String(params.get("mode") || "")
        .trim()
        .toUpperCase();

    const token =
      String(params.get("token") || "")
        .trim();

    const content =
      document.getElementById("content");


    // ==========================
    // SEMAK MODE
    // ==========================

    if (mode !== "KELUAR" && mode !== "MASUK") {

      content.innerHTML =
        '<div class="error">❌ QR tidak sah.</div>';

    }

    // ==========================
    // SEMAK TOKEN
    // ==========================

    else if (!token) {

      content.innerHTML =
        '<div class="error">❌ Token QR tidak dijumpai.</div>';

    }

    // ==========================
    // CIPTA QR BRIDGE
    // ==========================

    else {

      fetch(
        API_URL +
        "?action=createqrbridge&qrmode=" +
        encodeURIComponent(mode) +
        "&token=" +
        encodeURIComponent(token)
      )

      .then(response => response.json())

      .then(result => {

        if (!result.success) {

          content.innerHTML =
            '<div class="error">' +
            '❌ ' +
            (result.message || "QR tidak dapat disahkan.") +
            '</div>';

          return;
        }


        const code =
          result.code ||
          result.bridgeCode ||
          result.bridge ||
          "";


        if (!code) {

          content.innerHTML =
            '<div class="error">' +
            '❌ Kod pengesahan tidak diterima.' +
            '</div>';

          return;
        }


        content.innerHTML = `
          <div class="mode">
            QR ${mode}
          </div>

          <div class="info">
            Masukkan kod pengesahan ini dalam sistem:
          </div>

          <div class="code">
            ${code}
          </div>

          <div class="info">
            Kod ini hanya boleh digunakan sekali.
          </div>
        `;

      })

      .catch(error => {

        console.error(error);

        content.innerHTML =
          '<div class="error">' +
          '❌ Tidak dapat menghubungi sistem. Sila cuba semula.' +
          '</div>';

      });

    }

  </script>

</body>
</html>
