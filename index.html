<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian KAFA API</title>
</head>

<body style="font-family:Arial;text-align:center;padding:40px">

  <h2>UJIAN SAMBUNGAN KAFA</h2>

  <p id="status">Sedang menghubungi server...</p>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzDikjwJwKU3ORh4Y-S4zQM8o_Ppq3MIHsRTm4KQej4HMSquMCzxdXXVygODiuxu7q8/exec";

    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        document.getElementById("status").innerHTML =
          "✅ BERJAYA SAMBUNG<br><br>" +
          JSON.stringify(data);
      })
      .catch(error => {
        document.getElementById("status").innerHTML =
          "❌ GAGAL SAMBUNG<br><br>" + error;
      });
  </script>

</body>
</html>
